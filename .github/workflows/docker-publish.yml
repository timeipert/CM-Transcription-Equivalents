name: Build and Push Docker Image

# Storage rule: every push of `latest` leaves the previous image behind as an untagged version in the container
# registry, and that counts against the plan's storage. So the image is rebuilt only when what goes into it changes
# (see the Dockerfile: it copies ui/ only), and untagged versions are deleted after each push.
on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - ui/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Name of the container package (lower case)
        id: pkg
        run: echo "name=$(echo "${GITHUB_REPOSITORY#*/}" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      # Keeps the two newest untagged versions (a rollback target), deletes the rest. A failure here must not fail the deploy.
      - name: Delete superseded untagged image versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.pkg.outputs.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
