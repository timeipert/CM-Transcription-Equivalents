name: Deploy to GitHub Pages

# Publishes https://neume.monodi.app: the app, built from this commit. The built
# site is not committed (docs/ is gitignored build output). Needs the repository
# setting Pages -> Build and deployment -> Source = GitHub Actions, with the
# custom domain neume.monodi.app.
#
# Rolling back: revert the commit on master and push; this workflow publishes it.
# The last build of the previous app (before the persistence rework) is the commit
# tagged `legacy-site-2026-10-04`.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running one finish rather than cancel it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      # Nothing is published if any of these fail.
      - name: Lint
        working-directory: ./ui
        run: npm run lint

      - name: Type-check the core modules
        working-directory: ./ui
        run: npm run typecheck

      - name: Test
        working-directory: ./ui
        run: npm test

      # Writes the site to ../docs and fails if anything shipped from ui/public/ is missing.
      - name: Build
        working-directory: ./ui
        run: npm run build

      - name: Check the site
        run: |
          test -f docs/index.html
          test -f docs/CNAME
          test -f docs/index.json
          test -d docs/sources
          test -d docs/manual

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
